[project]
name = "lab6-intelligent-search"
version = "0.1.0"
description = "Lab 6 busqueda A* y red bayesiana"
authors = [
    {name = "GIANCARLOS ALEXANDER PILLCO CASTRO",email = "PILLCOG@GMAIL.COM"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14,!=3.14.1,<3.15"
dependencies = [
    "networkx (>=3.7,<4.0)",
    "pydantic (>=2.14.0,<3.0.0)",
    "fastapi (>=0.143.0,<0.144.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "pgmpy (>=1.1.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
